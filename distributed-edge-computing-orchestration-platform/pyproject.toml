[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-orchestrator"
version = "1.0.0"
description = "A dependency-free control plane for orchestrating containerized workloads across distributed edge fleets (retail stores, factories, warehouses, cell towers)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Company / Name Here" }]
keywords = [
  "edge-computing",
  "orchestration",
  "kubernetes",
  "iot",
  "5g",
  "network-slicing",
  "service-mesh",
  "hybrid-cloud",
  "data-sovereignty",
  "ota-updates",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Distributed Computing",
  "Topic :: System :: Networking",
]

# Intentionally empty: the control plane runs on the Python standard
# library alone. See README.md "Design Principles" for the rationale.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
edge-orchestrator = "edge_orchestrator.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
